name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile & package (skip tests)
        run: mvn -B -DskipTests package

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests (exclude DB-bound & DVC-data-bound integration)
        # integration tag = 连远程 MySQL 的 @SpringBootTest 集成测（本地才跑）；
        # GoldenSetEvalTest 依赖 DVC 管理的 golden-set/（Git 只提交指针，CI 无数据文件），一并排除。
        run: mvn -B verify -DexcludedGroups=integration -Dtest='!GoldenSetEvalTest' -DfailIfNoTests=false
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco/

  docker:
    runs-on: ubuntu-latest
    needs: [build, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (verify only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: finhub:ci
